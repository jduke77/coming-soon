<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>twobin — Coming soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink-900: #1a1c1c;
    --ink-600: #4e5354;
    --ink-500: #6b7172;
    --ink-400: #8b9192;
    --paper-50: #fbfaf7;
    --paper-300: #dfddd6;
    --accent: #E8A945;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    background: var(--paper-50);
    color: var(--ink-900);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
  }

  /* Hairline grid backdrop, faded to edges */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(20,20,20,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,20,20,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center;
    mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.85), transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.85), transparent 70%);
  }

  main {
    position: relative;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(28px, 5vh, 56px);
  }

  .logo {
    width: clamp(220px, 38vw, 360px);
    height: auto;
    display: block;
    animation: rise .7s ease-out both;
  }

  .label-row {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    animation: rise .7s ease-out .15s both;
  }
  .label-row .rule {
    width: clamp(40px, 8vw, 80px);
    height: 1px;
    background: var(--ink-400);
  }
  .coming-soon {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: clamp(14px, 1.6vw, 17px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-600);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .coming-soon .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(232,169,69,0.55);
    animation: pulseDot 1.8s ease-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulseDot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,169,69,0.55); }
    50% { box-shadow: 0 0 0 8px rgba(232,169,69,0); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .label-row { animation: none; }
    .coming-soon .dot { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <img src="assets/twobin-logo.png" alt="twobin" class="logo" />
    <div class="label-row">
      <span class="rule" aria-hidden="true"></span>
      <span class="coming-soon">
        <span class="dot" aria-hidden="true"></span>
        Coming soon
      </span>
      <span class="rule" aria-hidden="true"></span>
    </div>
  </main>
</body>
</html>
